name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Validate only, or create the tag and publish to npm, Docker Hub and GitHub
        type: choice
        options: [validate, publish]
        default: validate
        required: true
      version:
        description: Exact prepared package version, without v (required for publish)
        type: string
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: tracery-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2' }
      - run: git merge-base --is-ancestor HEAD origin/main
      # Also fails unless the hub package, Helm appVersion and k8s manifest
      # image tag all equal the root package.json version.
      - id: context
        run: node scripts/release-context.mjs
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}

  validate:
    needs: prepare
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2' }
      - run: npm ci
      - run: npm run license:check
      - run: node --test scripts/release-*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm test && npm run test:plugin
      - name: Test and retain actual npm tarballs
        run: npm run publish:check
        env:
          TRACERY_RELEASE_DIR: artifacts/npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - run: python -m pip install -e 'clients/python[dev]' && python -m pytest -q clients/python
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with: { version: v0.74.0, cache: false }
      - name: Inspect packaged npm files and record source SBOM
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports artifacts/unpacked
          for file in artifacts/npm/*.tgz; do
            target="artifacts/unpacked/$(basename "$file" .tgz)"
            mkdir -p "$target"
            tar -xzf "$file" -C "$target"
          done
          trivy fs --scanners license,secret --license-full --skip-version-check --format json --output artifacts/reports/npm-scan.json artifacts/unpacked
          node scripts/release-license-gate.mjs artifacts/reports/npm-scan.json
          trivy fs --scanners license --include-dev-deps --offline-scan --skip-version-check --skip-dirs .git --skip-dirs artifacts --format cyclonedx --output artifacts/reports/source-sbom.cdx.json .
          git rev-parse HEAD > artifacts/reports/source-commit.txt
          cp apps/hub/web/dist/THIRD-PARTY-NOTICES.txt artifacts/reports/
          cd artifacts
          find npm reports -type f ! -name npm-SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > reports/npm-SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidate-npm
          path: |
            artifacts/npm/
            artifacts/reports/
          if-no-files-found: error
          retention-days: 30

  containers:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, Linux, X64, arc-amd64]
            machine: x86_64
          - arch: arm64
            runner: [self-hosted, Linux, ARM64, arc-pi]
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
      LOCAL_IMAGE: tracery-release:${{ github.run_id }}-${{ matrix.arch }}
      LOCAL_SOURCES_IMAGE: tracery-release-sources:${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Require a native runner and Docker daemon
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$MACHINE"
          daemon_arch="$(docker info --format '{{.Architecture}}')"
          case "$ARCH:$daemon_arch" in amd64:x86_64|amd64:amd64|arm64:aarch64|arm64:arm64) ;; *) echo 'Docker daemon architecture does not match runner'; exit 1 ;; esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2' }
      - run: npm ci && npm run build -w @atriarch-systems/tracery-core -w @atriarch-systems/tracery-client
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with: { driver: docker, version: v0.37.1 }
      # The runtime image does not contain its OS sources; the same build's
      # sources-image target is published beside it as <version>-sources, and
      # SOURCES.txt inside the runtime image names both published locations.
      - name: Build and natively test the image and its matching source image
        env:
          SOURCE_IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          build=(docker buildx build --load --platform "linux/$ARCH" --provenance=false -f apps/hub/Dockerfile
            --build-arg "SOURCE_IMAGE_REPOSITORY=${SOURCE_IMAGE_REPOSITORY:-atriarchsystems/tracery-hub}"
            --build-arg "SOURCE_RELEASE_REPOSITORY=$GITHUB_REPOSITORY")
          "${build[@]}" -t "$LOCAL_IMAGE" .
          "${build[@]}" --target sources-image -t "$LOCAL_SOURCES_IMAGE" .
          node scripts/release-image-check.mjs "$LOCAL_IMAGE" "$LOCAL_SOURCES_IMAGE" "artifacts/container/$ARCH" "$ARCH"
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with: { version: v0.74.0, cache: false }
      - name: Gate this architecture and record its SBOM
        run: |
          dir="artifacts/container/$ARCH"
          trivy image --image-src docker --scanners vuln,license,secret --license-full --list-all-pkgs --skip-version-check --format json --output "$dir/image-scan.json" "$LOCAL_IMAGE"
          node scripts/release-license-gate.mjs "$dir/image-scan.json" "$dir/alpine-packages.json" "$dir/NODE-LICENSE" "$ARCH"
          trivy image --image-src docker --scanners license --skip-version-check --format cyclonedx --output "$dir/image-sbom.cdx.json" "$LOCAL_IMAGE"
      - name: Save the tested images and checksums
        run: |
          dir="artifacts/container/$ARCH"
          docker save "$LOCAL_IMAGE" | gzip > "$dir/image.tar.gz"
          docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}' > "$dir/image-id.txt"
          docker save "$LOCAL_SOURCES_IMAGE" | gzip > "$dir/sources-image.tar.gz"
          docker image inspect "$LOCAL_SOURCES_IMAGE" --format '{{.Id}}' > "$dir/sources-image-id.txt"
          git rev-parse HEAD > "$dir/source-commit.txt"
          cd artifacts
          find "container/$ARCH" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "container/$ARCH/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidate-container-${{ matrix.arch }}
          # Include the artifacts root so downloading all candidates can safely merge them.
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove the local image tags
        if: always()
        run: docker image rm "$LOCAL_IMAGE" "$LOCAL_SOURCES_IMAGE" || true

  # Publication is three jobs run in order, so each credential is only present
  # where it is used and the GitHub release is only undrafted after everything
  # (npm and Docker Hub) is published:
  #   preflight    verify every artifact and credential, then create the tag and draft release
  #   publish-npm  npm tarballs with provenance (GitHub-hosted: npm signs provenance and
  #                supports Trusted Publishing only there)
  #   publish      Docker Hub images, then undraft the GitHub release with its evidence
  preflight:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, validate, containers]
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-candidate-*
          merge-multiple: true
          path: artifacts
      - name: Verify all artifacts and required publication settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME" || { echo 'Missing DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKER_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN'; exit 1; }
          [[ "$DOCKERHUB_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Set DOCKERHUB_IMAGE to namespace/repository'; exit 1; }
          (cd artifacts && sha256sum -c reports/npm-SHA256SUMS)
          test "$(cat artifacts/reports/source-commit.txt)" = "$GITHUB_SHA"
          for arch in amd64 arm64; do
            (cd artifacts && sha256sum -c "container/$arch/SHA256SUMS")
            test "$(cat "artifacts/container/$arch/source-commit.txt")" = "$GITHUB_SHA"
            # The image's SOURCES.txt must name the places the publish job publishes the sources.
            grep -qF "$DOCKERHUB_IMAGE:$RELEASE_VERSION-sources" "artifacts/container/$arch/SOURCES.txt" || { echo "SOURCES.txt does not name $DOCKERHUB_IMAGE:$RELEASE_VERSION-sources"; exit 1; }
            grep -qF "github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" "artifacts/container/$arch/SOURCES.txt" || { echo 'SOURCES.txt does not name this GitHub release'; exit 1; }
          done
      - name: Ensure public Docker repository and immutable version tags
        run: node scripts/release-docker-check.mjs
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # This same run publishes: tags created with GITHUB_TOKEN do not trigger push workflows.
      - name: Create or verify the release tag and draft GitHub release
        run: node scripts/release-github.mjs --prepare
        env:
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, validate, preflight]
    # The one GitHub-hosted job: npm provenance and Trusted Publishing need a
    # GitHub-hosted runner and the workflow's OIDC identity. It runs no repository code
    # beyond scripts/release-npm.mjs (node built-ins only; no npm ci, no build).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-npm
          path: artifacts
      - name: Re-verify the tested npm artifacts
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -c reports/npm-SHA256SUMS)
          test "$(cat artifacts/reports/source-commit.txt)" = "$GITHUB_SHA"
      # Trusted Publishing needs npm 11.5.1 or newer; the npm bundled with Node 22 is older.
      - name: Install a pinned npm that supports provenance and Trusted Publishing
        run: |
          npm install -g npm@11.21.0
          npm --version
      - name: Check npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            npm whoami --registry https://registry.npmjs.org
          else
            echo 'No NPMJS_TOKEN: publishing through npm Trusted Publishing (OIDC). Each package must list this workflow as its Trusted Publisher (docs/PUBLISHING.md).'
          fi
      - name: Publish tested npm tarballs in dependency order, with provenance
        run: node scripts/release-npm.mjs artifacts/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, validate, containers, preflight, publish-npm]
    runs-on: [self-hosted, Linux, X64, arc-amd64]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.23.2' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-candidate-*
          merge-multiple: true
          path: artifacts
      - name: Verify the saved images and record the combined checksums
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -c reports/npm-SHA256SUMS)
          test "$(cat artifacts/reports/source-commit.txt)" = "$GITHUB_SHA"
          for arch in amd64 arm64; do
            (cd artifacts && sha256sum -c "container/$arch/SHA256SUMS")
            test "$(cat "artifacts/container/$arch/source-commit.txt")" = "$GITHUB_SHA"
            gzip -dc "artifacts/container/$arch/image.tar.gz" | docker load
            image="tracery-release:$GITHUB_RUN_ID-$arch"
            test "$(docker image inspect "$image" --format '{{.Id}}')" = "$(cat "artifacts/container/$arch/image-id.txt")"
            test "$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
            gzip -dc "artifacts/container/$arch/sources-image.tar.gz" | docker load
            sources_image="tracery-release-sources:$GITHUB_RUN_ID-$arch"
            test "$(docker image inspect "$sources_image" --format '{{.Id}}')" = "$(cat "artifacts/container/$arch/sources-image-id.txt")"
            test "$(docker image inspect "$sources_image" --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
          done
          cd artifacts
          find npm container reports -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with: { driver: docker, version: v0.37.1 }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested source images, then architecture images and multi-platform tags
        run: node scripts/release-docker-publish.mjs
      # Undrafts the release, so it only runs once npm (publish-npm) and Docker Hub are both published.
      - name: Publish GitHub release and evidence
        run: node scripts/release-github.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Remove local image tags
        if: always()
        run: |
          for arch in amd64 arm64; do
            docker image rm "tracery-release:$GITHUB_RUN_ID-$arch" "tracery-release-sources:$GITHUB_RUN_ID-$arch" || true
            if [ -n "$DOCKERHUB_IMAGE" ]; then docker image rm "$DOCKERHUB_IMAGE:$RELEASE_VERSION-$arch" "$DOCKERHUB_IMAGE:$RELEASE_VERSION-sources-$arch" || true; fi
          done
