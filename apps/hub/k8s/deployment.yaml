apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracery-hub
  namespace: tracery
  labels:
    app.kubernetes.io/name: tracery-hub
spec:
  # SqliteStore/MemoryStore are single-writer; do not scale this beyond 1
  # unless TRACERY_STORE is switched to postgres below (SPEC.md §6
  # "Storage"), which is the only backing store this Deployment can safely
  # run with replicas > 1 (also drop `strategy: Recreate` for a normal
  # `RollingUpdate` once you do).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tracery-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracery-hub
    spec:
      # The image runs as uid/gid 10001; fsGroup makes /data writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: atriarchsystems/tracery-hub:0.1.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8971
          env:
            - name: TRACERY_PORT
              value: "8971"
            # Non-loopback: apps/hub/README.md "Auth mode" -- a non-loopback
            # TRACERY_HOST requires either TRACERY_API_KEYS(_FILE) (set below)
            # or an explicit TRACERY_AUTH=none opt-out, or the hub fails at
            # boot. This manifest always configures real keys, so that rule
            # never bites here.
            - name: TRACERY_HOST
              value: "0.0.0.0"
            - name: TRACERY_STORE
              value: sqlite
            - name: TRACERY_SQLITE_PATH
              value: /data/tracery.db
            - name: TRACERY_API_KEYS_FILE
              value: /etc/tracery/keys.json
            - name: TRACERY_RETENTION_HOURS
              value: "72"
            - name: TRACERY_MAX_EVENTS_PER_WORKSPACE
              value: "500000"
            - name: TRACERY_LOG_LEVEL
              value: info
            # --- Alternative: Postgres-backed store (SPEC.md §6 "Storage"), the
            # only backing store this Deployment can run with replicas > 1. To
            # switch: comment out TRACERY_STORE/TRACERY_SQLITE_PATH above and the
            # `data` volume/volumeMount/PVC below, then uncomment these two:
            # - name: TRACERY_STORE
            #   value: postgres
            # - name: TRACERY_POSTGRES_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: tracery-hub-postgres # provision via OpenBao/ExternalSecret; a postgres:// URL, e.g. postgres://tracery:PASSWORD@tracery-postgres:5432/tracery
            #       key: url
          volumeMounts:
            # Writable scratch space; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: keys
              mountPath: /etc/tracery
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: tracery-hub-data
        - name: keys
          secret:
            secretName: tracery-hub-keys
